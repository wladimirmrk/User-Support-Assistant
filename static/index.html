<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Support Assistant — CloudDesk</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #34d399;
      --badge-bg: #0f2744;
      --code-bg: #090d16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 18px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    textarea, input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .quick-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .quick-title {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-quick {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-quick:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      color: white;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #0f172a;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-card {
      display: none;
    }

    .result-header {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--success);
    }

    .answer-text {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #e2e8f0;
      background: rgba(0, 0, 0, 0.2);
      padding: 16px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    details {
      margin-top: 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }

    summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
    }

    summary:hover {
      color: var(--accent);
    }

    .debug-content {
      margin-top: 10px;
      font-size: 12px;
    }

    .chunk-item {
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .chunk-header {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
    }

    pre {
      background: var(--code-bg);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">AI</div>
        <div>
          <h1>AI Support Assistant</h1>
          <div class="subtitle">Интеллектуальная поддержка пользователей CloudDesk</div>
        </div>
      </div>
      <div class="badges">
        <span class="badge">RAG: ChromaDB + Ollama</span>
        <span class="badge">MCP: FastMCP stdio</span>
        <span class="badge">LLM: OpenRouter</span>
      </div>
    </header>

    <div class="card">
      <div class="quick-bar">
        <span class="quick-title">Быстрый запуск сценариев:</span>
        <button type="button" class="btn-quick" onclick="loadScenario('auth')">🎯 Основной сценарий (Ошибка авторизации TCK-1042)</button>
        <button type="button" class="btn-quick" onclick="loadScenario('2fa')">🔑 Проблема с 2FA (TCK-1044)</button>
        <button type="button" class="btn-quick" onclick="loadScenario('unknown')">❓ Вопрос вне документации</button>
      </div>

      <form id="askForm" onsubmit="handleAsk(event)">
        <div class="form-group">
          <label for="question">Вопрос пользователя / обращение в поддержку:</label>
          <textarea id="question" placeholder="Например: Почему не работает авторизация?" required></textarea>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="ticket_id">ID тикета (опционально):</label>
            <input type="text" id="ticket_id" placeholder="Например: TCK-1042">
          </div>
          <div class="form-group">
            <label for="user_id">ID пользователя (опционально):</label>
            <input type="text" id="user_id" placeholder="Например: USR-001">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">
          <div class="spinner" id="spinner"></div>
          <span id="btnText">Сгенерировать ответ ассистента</span>
        </button>
      </form>
    </div>

    <div class="card result-card" id="resultCard">
      <div class="result-header">
        <span>💬 Ответ ассистента поддержки</span>
      </div>
      <div class="answer-text" id="answerText"></div>

      <!-- Источники RAG -->
      <details id="ragDetails">
        <summary>📚 Найденные фрагменты документации (RAG ChromaDB)</summary>
        <div class="debug-content" id="ragChunks"></div>
      </details>

      <!-- Данные MCP -->
      <details id="mcpDetails">
        <summary>🔌 Контекст тикета и пользователя (MCP Сервер)</summary>
        <div class="debug-content" id="mcpContent"></div>
      </details>
    </div>
  </div>

  <script>
    function loadScenario(type) {
      const qInput = document.getElementById("question");
      const tInput = document.getElementById("ticket_id");
      const uInput = document.getElementById("user_id");

      if (type === "auth") {
        qInput.value = "Почему не работает авторизация?";
        tInput.value = "TCK-1042";
        uInput.value = "USR-001";
      } else if (type === "2FA") {
        qInput.value = "Приложение аутентификации выдает сбой при вводе кода, что делать?";
        tInput.value = "TCK-1044";
        uInput.value = "USR-003";
      } else if (type === "unknown") {
        qInput.value = "Как приготовить домашнюю пиццу Маргарита?";
        tInput.value = "";
        uInput.value = "";
      }
    }

    async function handleAsk(e) {
      e.preventDefault();
      const question = document.getElementById("question").value.trim();
      const ticket_id = document.getElementById("ticket_id").value.trim() || null;
      const user_id = document.getElementById("user_id").value.trim() || null;

      if (!question) return;

      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const spinner = document.getElementById("spinner");
      const resultCard = document.getElementById("resultCard");
      const answerText = document.getElementById("answerText");
      const ragChunks = document.getElementById("ragChunks");
      const mcpContent = document.getElementById("mcpContent");

      submitBtn.disabled = true;
      spinner.style.display = "inline-block";
      btnText.textContent = "Ассистент думает...";

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, ticket_id, user_id })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.detail || `Ошибка сервера: ${res.status}`);
        }

        const data = await res.json();
        
        // Отображение ответа
        answerText.textContent = data.answer;
        resultCard.style.display = "block";

        // Отображение RAG источников
        if (data.rag_chunks && data.rag_chunks.length > 0) {
          ragChunks.innerHTML = data.rag_chunks.map((c, i) => `
            <div class="chunk-item">
              <div class="chunk-header">Фрагмент #${i + 1}: ${c.header || 'Раздел'} <span style="color:#64748b;">(${c.source})</span></div>
              <div>${escapeHtml(c.content)}</div>
            </div>
          `).join("");
        } else {
          ragChunks.innerHTML = "<div style='color:#94a3b8;'>Фрагменты документации не найдены.</div>";
        }

        // Отображение MCP данных
        if (data.mcp_data) {
          mcpContent.innerHTML = `<pre>${escapeHtml(JSON.stringify(data.mcp_data, null, 2))}</pre>`;
        } else {
          mcpContent.innerHTML = "<div style='color:#94a3b8;'>Данные MCP не запрашивались.</div>";
        }

        resultCard.scrollIntoView({ behavior: "smooth", block: "nearest" });

      } catch (err) {
        alert("Ошибка: " + err.message);
      } finally {
        submitBtn.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "Сгенерировать ответ ассистента";
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
